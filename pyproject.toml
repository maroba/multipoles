[build-system]
requires = ["setuptools>=64", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "multipoles"
authors = [
    {name = "Matthias Baer"},
]
maintainers = [
    {name = "Matthias Baer", email="matthias.r.baer@googlemail.com"},
]
description = "A Python package for multipole expansions of electrostatic or gravitational potentials"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "numpy",
    "scipy",
]
dynamic = ["version"]

requires-python = ">=3.9"
keywords=['multipole expansion',  'physics', 'scientific-computing']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]



[project.urls]
Homepage = "https://github.com/maroba/multipoles"
Documentation = "https://maroba.github.io/multipoles/"
Changelog = "https://github.com/maroba/multipoles/blob/master/CHANGELOG.md"
source = "https://github.com/maroba/multipoles"
Issues = "https://github.com/maroba/multipoles/issues"
tracker = "https://github.com/maroba/multipoles/issues"

[tool.setuptools.packages.find]
include = ["multipoles"]

[tool.setuptools.dynamic]
version = { attr = "multipoles.__version__" }

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["docs/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E741",  # l, m are the usual names of the angular momentum quantum numbers
    "B905",  # zip() without strict=, the arrays have matching lengths by construction
]
