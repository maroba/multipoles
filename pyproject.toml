[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "multipoles"
authors = [
    {name = "Matthias Baer"},
]
maintainers = [
    {name = "Matthias Baer", email="matthias.r.baer@googlemail.com"},
]
description = "A Python package for multipole expansions of electrostatic or gravitational potentials"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.22",
]
dynamic = ["version"]

requires-python = ">=3.10"
keywords = ["multipole expansion", "physics", "electrostatics", "gravity", "poisson equation", "scientific-computing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.optional-dependencies]
plot = ["matplotlib"]
test = ["pytest", "pytest-cov", "scipy", "hypothesis", "matplotlib"]
dev = ["multipoles[test]", "ruff"]

[project.urls]
Homepage = "https://github.com/maroba/multipoles"
Documentation = "https://maroba.github.io/multipoles/"
Changelog = "https://github.com/maroba/multipoles/blob/master/CHANGELOG.md"
Source = "https://github.com/maroba/multipoles"
Issues = "https://github.com/maroba/multipoles/issues"

[tool.setuptools.packages.find]
include = ["multipoles"]

[tool.setuptools.package-data]
multipoles = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "multipoles.__version__" }

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["docs/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E741",  # l, m are the usual names of the angular momentum quantum numbers
    "B905",  # zip() without strict=, the arrays have matching lengths by construction
]
