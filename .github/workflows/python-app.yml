name: Checks

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # run all combinations even if one fails, to see all results
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        os: [ ubuntu-latest ]
        include:
          - python-version: "3.13"
            os: macos-latest
          - python-version: "3.13"
            os: windows-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip freeze
      - name: Test with pytest
        run: pytest --cov=multipoles --cov-report=xml
      - name: Upload code coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  test-oldest:
    name: Test with the oldest supported dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.22.4" -e ".[test]"
          pip freeze
      - name: Test with pytest
        run: pytest

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Lint with ruff
        run: ruff check --output-format=github .

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r docs/requirements.txt
      - name: Build documentation
        # The notebook is executed and converted to a markdown page first. Strict: fail on
        # warnings, e.g. broken docstrings or links.
        run: |
          jupyter nbconvert --to markdown --execute docs/accuracy.ipynb --output-dir docs
          zensical build --strict

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build and check the package
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
