name: Deploy documentation

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r docs/requirements.txt ghp-import
      - name: Build documentation
        # The notebook is executed and converted to a markdown page first
        run: |
          jupyter nbconvert --to markdown --execute docs/accuracy.ipynb --output-dir docs
          zensical build --strict
      - name: Deploy to GitHub Pages
        # Publish the site on the gh-pages branch, from which GitHub Pages serves it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ghp-import --no-jekyll --push --force --message "Deploy documentation for ${GITHUB_REF_NAME}" site
